# benchmarks/latency/bench.conf
#
# Edit this file once with your machine's NIC / IP / CPU layout.
# Afterwards run a single scenario at a time:
#
#     sudo ./benchmarks/latency/lat tcp                # raw TCP RTT (kernel)
#     sudo ./benchmarks/latency/lat udp --dpdk         # raw UDP RTT (DPDK client)
#     sudo ./benchmarks/latency/lat ex_market          # exchange bookTicker push
#
# Override individual values at runtime via $BENCH_CONFIG (point to a
# different file) or by editing this one. Settings are read directly by
# each lat_* binary via bench::load_bench_conf().

# ─── Required: networking ───────────────────────────────────────────
NIC_A=ens34                       # server-side NIC (kernel mock binds here)
NIC_B=ens35                       # client-side NIC (moved into bench_ns for kernel,
                                  # bound to vfio-pci for DPDK)
SERVER_IP=172.31.21.173           # NIC-A IP
LOCAL_IP=172.31.23.112             # NIC-B IP
GATEWAY_IP=172.31.16.1            # default gateway for NIC-B routing

# Optional: NIC_B's PCI BDF. Set this when NIC_B may be permanently
# bound to vfio-pci on your host (i.e. /sys/class/net/$NIC_B doesn't
# exist on a fresh boot). Without it, the lat wrapper falls back to
# /sys/class/net/$NIC_B/device → .dpdk_state cache, which fails on
# the very first run after a reboot if the NIC was already on vfio-pci.
NIC_B_PCI=0000:28:00.0

# ─── CPU pinning ─────────────────────────────────────────────────────
CLIENT_CPU=2                      # bench client poll thread cpu (isolcpus recommended)
MOCK_CPU=4                        # mock server cpu
EAL_CORES=0,1                     # DPDK EAL lcores
ALLOW_NON_ISOLATED=true            # relax isolcpus hard check (dev hosts only)

# ─── Measurement window ──────────────────────────────────────────────
DURATION=10                       # seconds per payload sweep step
WARMUP=2                          # seconds of warmup before measuring
SERVER_WORK_NS=200                # mock spin ns simulating business work

# ─── Payload sweeps ──────────────────────────────────────────────────
TCP_PAYLOADS=64,128,256,512,1024,1460,4096,16384
UDP_PAYLOADS=64,128,256,512,1024,1472
WS_PAYLOADS=64,128,256,512,1024,4096
MD_UDP_PAYLOADS=64,256,1024,1400
INFLIGHTS=1,4,16,64

# ─── Exchange WS mock tuning ─────────────────────────────────────────
#
# Defaults target realistic Binance rates: ~1 kHz bookTicker per symbol,
# 100 Hz depth per symbol, Poisson trade 5 ms mean. Drop BOOKTICKER_US to
# 100 (10 kHz/sym) for a stress test that hits kernel TCP queue limits.
SYMBOLS=BTCUSDT,ETHUSDT,SOLUSDT
BOOKTICKER_US=1000
DEPTH_MS=10
TRADE_MEAN_MS=5
KLINE_S=1
DEPTH_BYTES=1024

# ─── Phase 10: mirrored keys (lowercase) + per-scenario sections ─────
#
# Phase 10 rewrites the bench client/mock pair to read both a global
# CommonConfig section (lowercase, monotonic_raw_ns-friendly) and a
# scenario-specific `[lat_*]` INI section. The legacy uppercase keys
# above stay for the stage-3 BenchConfig loader; the lowercase keys
# below are what the new CommonConfig loader reads.
#
# Physical NIC topology (AWS VPC dual-ENI):
#
#   ens34 (kernel-bound) <-- mock binds here with mock_ip
#   ens35 (kernel OR vfio-pci)  <-- client lives here
#     └─ kernel mode: ens35 is moved into bench_ns so host routing cannot
#        shortcut ens34↔ens35 via lo; traffic goes out the physical
#        queue → AWS VPC fabric → back into ens34 → kernel mock.
#     └─ dpdk mode: ens35 is bound to vfio-pci; DPDK PMD owns the
#        hardware queue; traffic path is identical (out the wire →
#        VPC → ens34 kernel mock).
#
# Both modes traverse the same physical path with the same kernel mock;
# only the client-side code path (kernel TCP/UDP stack vs DPDK PMD)
# differs. This is the fairness contract per memory/feedback_bench_no_loopback.md.
mock_nic       = ens34
mock_ip        = 172.31.21.173
client_nic     = ens35
client_ip      = 172.31.23.112
netmask        = 255.255.240.0
gateway_ip     = 172.31.16.1
cpu_client     = 4
cpu_mock       = 6
warmup_samples = 1000

[lat_tcp]
port            = 20000
payload_size    = 256
duration_seconds = 300

[lat_udp]
port            = 20001
payload_size    = 256
duration_seconds = 300

[lat_ws]
port            = 20002
ws_path         = /echo
payload_size    = 256
duration_seconds = 300

[lat_ex_market]
port             = 20003
ws_path          = /ws/bookticker
# Legacy fixed-rate knob, honoured only by the retired Python mock
# (mocks/ex_market_push.py). The C++ mockex ignores it and drives the
# inter-arrival distribution from mockex_params below — to change the
# effective rate, refit with tools/fit_mmpp.py or hand-edit the ini.
push_rate_hz     = 10000
duration_seconds = 300
# Phase 3 mockex push parameters. Replace the *_sample.jsonl with a
# real capture (tools/capture_binance.py --stream btcusdt@bookTicker)
# and refit params.ini to get realistic traffic shape.
mockex_params    = benchmarks/mockex/fixtures/ex_market_params.ini
mockex_payload   = benchmarks/mockex/fixtures/ex_market_sample.jsonl
mockex_seed      = 42

[lat_ex_order]
port             = 20004
ws_path          = /ws/order
# Strict one-at-a-time semantics: send order → wait for response →
# record legs → send next. No pipelining, no slot table. This makes
# each order a self-contained RTT sample and guarantees the percentile
# math p50(TX)+p50(RX) ≤ p50(RTT) per Gate 5 sanity.
# order_count caps total orders; bumped to 20M so 300s at ~30k/s
# (max serial throughput) can't hit the cap before the deadline.
order_count      = 20000000
duration_seconds = 300

[lat_ex_md_udp]
port             = 20005
payload_size     = 256
duration_seconds = 300

[lat_ex_market_2p]
port             = 20007
ws_path          = /ws/bookticker
push_rate_hz     = 10000
duration_seconds = 300
burst_size       = 10
symbols          = BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT
mode             = twophase
# Phase 3 mockex push parameters.
mockex_params    = benchmarks/mockex/fixtures/ex_market_2p_params.ini
mockex_payload   = benchmarks/mockex/fixtures/ex_market_2p_sample.jsonl
mockex_seed      = 42
