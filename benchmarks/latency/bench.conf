# benchmarks/latency/bench.conf
#
# Edit this file once with your machine's NIC / IP / CPU layout.
# Afterwards run a single scenario at a time:
#
#     sudo ./scripts/lat tcp                # raw TCP RTT (kernel)
#     sudo ./scripts/lat udp --dpdk         # raw UDP RTT (DPDK client)
#     sudo ./scripts/lat ex_market          # exchange bookTicker push
#
# Override individual values at runtime via $BENCH_CONFIG (point to a
# different file) or by editing this one. Settings are read directly by
# each lat_* binary via bench::load_bench_conf().

# ─── Required: networking ───────────────────────────────────────────
NIC_A=ens34                       # server-side NIC (kernel mock binds here)
NIC_B=ens35                       # client-side NIC (moved into bench_ns for kernel,
                                  # bound to vfio-pci for DPDK)
SERVER_IP=172.31.21.173           # NIC-A IP
LOCAL_IP=172.31.23.112             # NIC-B IP
GATEWAY_IP=172.31.16.1            # default gateway for NIC-B routing

# ─── CPU pinning ─────────────────────────────────────────────────────
CLIENT_CPU=2                      # bench client poll thread cpu (isolcpus recommended)
MOCK_CPU=4                        # mock server cpu
EAL_CORES=0,1                     # DPDK EAL lcores
ALLOW_NON_ISOLATED=true            # relax isolcpus hard check (dev hosts only)

# ─── Measurement window ──────────────────────────────────────────────
DURATION=10                       # seconds per payload sweep step
WARMUP=2                          # seconds of warmup before measuring
SERVER_WORK_NS=200                # mock spin ns simulating business work

# ─── Payload sweeps ──────────────────────────────────────────────────
TCP_PAYLOADS=64,128,256,512,1024,1460,4096,16384
UDP_PAYLOADS=64,128,256,512,1024,1472
WS_PAYLOADS=64,128,256,512,1024,4096
MD_UDP_PAYLOADS=64,256,1024,1400
INFLIGHTS=1,4,16,64

# ─── Exchange WS mock tuning ─────────────────────────────────────────
#
# Defaults target realistic Binance rates: ~1 kHz bookTicker per symbol,
# 100 Hz depth per symbol, Poisson trade 5 ms mean. Drop BOOKTICKER_US to
# 100 (10 kHz/sym) for a stress test that hits kernel TCP queue limits.
SYMBOLS=BTCUSDT,ETHUSDT,SOLUSDT
BOOKTICKER_US=1000
DEPTH_MS=10
TRADE_MEAN_MS=5
KLINE_S=1
DEPTH_BYTES=1024
